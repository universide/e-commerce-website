{% extends 'layout.html' %}
{% block title %}Password reset - Flask Commerce Demo{% endblock %}
{% block content %}
<div class="auth-container">
  <h2>Password reset demonstration</h2>
  <p>Email delivery is intentionally disabled in this portfolio project.</p>
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required>
    <button type="submit">Test reset flow</button>
  </form>
</div>
{% endblock %}
