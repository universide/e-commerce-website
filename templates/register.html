{% extends 'layout.html' %}
{% block title %}Register - Flask Commerce Demo{% endblock %}
{% block content %}
<div class="auth-container">
  <h2>Create an account</h2>
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" minlength="3" maxlength="80" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="new-password" required>
    <div class="password-requirements">
      At least eight characters with uppercase, lowercase, a number, and a special character.
    </div>
    <button type="submit">Register</button>
  </form>
  <p>Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
</div>
{% endblock %}
